name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Lockstep vs package.json
        run: node scripts/check-lockstep.mjs --rebuild --git
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$EXPECTED" ]; then
            echo "package.json version $PKG does not match tag $TAG"
            exit 1
          fi
      - name: Changelog notes
        run: node scripts/changelog-notes.mjs "$GITHUB_REF_NAME" > /tmp/notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-beta.*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md $PRERELEASE_FLAG
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            *-beta.*) npm publish --access public --tag beta ;;
            *) npm publish --access public ;;
          esac
